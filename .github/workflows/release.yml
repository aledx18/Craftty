name: Release

# Trigger: annotated tag vX.Y.Z (see scripts/release.ts)
#   bun run release
#   bun run release 0.2.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: craftty-linux-x64
            target: bun-linux-x64
          - os: ubuntu-24.04-arm
            out: craftty-linux-arm64
            target: bun-linux-arm64
          - os: macos-14
            out: craftty-darwin-arm64
            target: bun-darwin-arm64
          - os: macos-13
            out: craftty-darwin-x64
            target: bun-darwin-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        env:
          CRAFTTY_OUT: ${{ matrix.out }}
          CRAFTTY_TARGET: ${{ matrix.target }}
        run: bun run scripts/build-binary.ts

      - name: Ensure executable bit
        run: chmod +x "dist/${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums + permissions
        working-directory: release-assets
        run: |
          set -euo pipefail
          chmod +x craftty-*
          ls -lah
          if command -v sha256sum >/dev/null; then
            sha256sum craftty-* | tee SHA256SUMS
          else
            shasum -a 256 craftty-* | tee SHA256SUMS
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-assets/craftty-*
            release-assets/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
